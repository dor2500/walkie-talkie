<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090c12"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a374a"/>
      <stop offset="50%" stop-color="#161f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="redPtt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(245,158,11,0.25)" stroke-width="6"/>

  <!-- Antenna Waves -->
  <circle cx="170" cy="80" r="28" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.3"/>
  <circle cx="170" cy="80" r="48" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.2"/>

  <!-- Antenna Rod -->
  <rect x="160" y="80" width="20" height="90" rx="10" fill="#334155"/>
  <rect x="156" y="70" width="28" height="18" rx="8" fill="#f59e0b" filter="url(#glow)"/>

  <!-- Volume Dial -->
  <rect x="310" y="130" width="36" height="30" rx="6" fill="#475569"/>

  <!-- Radio Main Body -->
  <rect x="120" y="150" width="272" height="310" rx="42" fill="url(#bodyGrad)" stroke="#334155" stroke-width="5"/>

  <!-- LCD Screen -->
  <rect x="152" y="185" width="208" height="85" rx="14" fill="#07110d" stroke="#133a28" stroke-width="3"/>
  <text x="256" y="222" font-family="monospace" font-size="22" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="3">446.006</text>
  <text x="256" y="250" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle" letter-spacing="1">LIVE MESH CH-1</text>

  <!-- Speaker Grille Holes -->
  <g fill="#1e293b">
    <circle cx="210" cy="315" r="5"/><circle cx="233" cy="315" r="5"/><circle cx="256" cy="315" r="5"/><circle cx="279" cy="315" r="5"/><circle cx="302" cy="315" r="5"/>
    <circle cx="221" cy="335" r="5"/><circle cx="244" cy="335" r="5"/><circle cx="267" cy="335" r="5"/><circle cx="290" cy="335" r="5"/>
    <circle cx="210" cy="355" r="5"/><circle cx="233" cy="355" r="5"/><circle cx="256" cy="355" r="5"/><circle cx="279" cy="355" r="5"/><circle cx="302" cy="355" r="5"/>
  </g>

  <!-- Big Central PTT Button -->
  <circle cx="256" cy="405" r="32" fill="url(#redPtt)" stroke="#fca5a5" stroke-width="3" filter="url(#glow)"/>
  <polygon points="256,392 265,410 247,410" fill="#ffffff"/>
</svg>
