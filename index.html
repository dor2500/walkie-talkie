<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taskflow</title>
  <link rel="stylesheet" href="src/styles.css" />
  <script>
    // Apply the theme before first paint to avoid a light flash; key matches src/storage.js.
    try {
      document.documentElement.dataset.theme = localStorage.getItem('taskflow.theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {}
  </script>
</head>
<body>
  <main class="app">
    <header>
      <h1>Taskflow</h1>
      <button id="theme-toggle" type="button"></button>
    </header>
    <form id="new-task">
      <input id="title" placeholder="What needs to be done?" autocomplete="off" />
      <button>Add</button>
    </form>
    <ul id="tasks"></ul>
    <footer><span id="count"></span><button id="clear">Clear completed</button></footer>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
