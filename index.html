<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>ווקי טוקי - לא נתקע</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
// Clean up the Service Worker / caches left by older versions of this site
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister())).catch(()=>{});}
if(window.caches){caches.keys().then(k=>k.forEach(n=>caches.delete(n))).catch(()=>{});}
</script>
<style>
:root{--amber:#facc15;--amber-d:#eab308;--bg:#09090b;--card:rgba(24,24,27,.72);--line:rgba(255,255,255,.08);}
*{-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Rubik',system-ui,sans-serif;min-height:100dvh;
  background:
    radial-gradient(60rem 30rem at 50% -10rem,rgba(250,204,21,.13),transparent 70%),
    radial-gradient(40rem 25rem at 50% 120%,rgba(220,38,38,.10),transparent 70%),
    var(--bg);
  background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom)}
.wrap{padding-top:max(1.25rem,env(safe-area-inset-top))}

/* screens fade in every time they are un-hidden */
.screen{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:1.5rem;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.45rem .9rem;font-size:.9rem}
.btn{transition:transform .12s ease,filter .15s ease,box-shadow .2s ease;user-select:none}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.07)}
.btn-amber{background:linear-gradient(180deg,#fde047,var(--amber-d));color:#111;box-shadow:0 10px 30px -10px rgba(250,204,21,.55),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-green{background:linear-gradient(180deg,#4ade80,#16a34a);color:#04120a;box-shadow:0 10px 30px -10px rgba(34,197,94,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.btn-ghost{background:rgba(39,39,42,.7);border:1px solid var(--line)}
.field{background:rgba(9,9,11,.6);border:2px solid rgba(250,204,21,.35);transition:border-color .2s,box-shadow .2s;outline:none}
.field:focus{border-color:var(--amber);box-shadow:0 0 0 4px rgba(250,204,21,.15)}
.field::placeholder{color:rgba(255,255,255,.3)}

/* logo */
.logo{width:6.5rem;height:6.5rem;border-radius:2rem;display:grid;place-items:center;font-size:3.4rem;margin-inline:auto;
  background:linear-gradient(160deg,rgba(250,204,21,.25),rgba(250,204,21,.04));border:1px solid rgba(250,204,21,.3);
  box-shadow:0 20px 50px -15px rgba(250,204,21,.45)}

/* option cards on welcome screen */
.opt{display:flex;align-items:center;gap:1rem;width:100%;text-align:right;padding:1.1rem 1.2rem;border-radius:1.4rem}
.opt .ic{width:3.2rem;height:3.2rem;border-radius:1rem;display:grid;place-items:center;font-size:1.7rem;flex:none}
.opt.btn-amber .ic{background:rgba(0,0,0,.12)}
.opt.btn-ghost .ic{background:rgba(255,255,255,.06)}

/* room code + QR */
#roomCode{direction:ltr;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(250,204,21,.35)}
.qr-box{background:#fff;padding:.9rem;border-radius:1.4rem;box-shadow:0 20px 50px -20px rgba(255,255,255,.35)}
#qrcode img,#qrcode canvas{display:block}
#status:not(:empty){display:inline-flex;align-items:center;gap:.45rem;background:rgba(39,39,42,.7);border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem}
#status:not(:empty)::before{content:'';width:.5rem;height:.5rem;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}

/* scanner */
#reader{border-radius:1.25rem;overflow:hidden;border:1px solid var(--line)!important;background:#000}
#reader video{border-radius:1.25rem}
.divider{display:flex;align-items:center;gap:.75rem;color:rgba(255,255,255,.35);font-size:.85rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}

/* participants list (rows are generated by the script) */
#peers>div{background:rgba(24,24,27,.72)!important;border:1px solid var(--line);border-radius:1rem!important;padding:.75rem 1rem!important;align-items:center;animation:fadeUp .3s ease both}
#peers>div>span:first-child{display:flex;align-items:center;gap:.6rem;font-weight:500}
#peers>div>span:first-child::before{content:'';width:.55rem;height:.55rem;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
#peers>div>span:last-child{font-family:ui-monospace,monospace;direction:ltr}

/* "talking now" banner */
#nowTalk{background:linear-gradient(180deg,rgba(34,197,94,.18),rgba(34,197,94,.06));border:1px solid rgba(34,197,94,.35);animation:fadeUp .25s ease both}
.bars{display:flex;gap:4px;align-items:flex-end;height:22px;justify-content:center}
.bars i{width:4px;border-radius:2px;background:#4ade80;animation:eq 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.2s}.bars i:nth-child(3){animation-delay:-.4s}.bars i:nth-child(4){animation-delay:-.6s}.bars i:nth-child(5){animation-delay:-.8s}
@keyframes eq{0%,100%{height:5px}50%{height:22px}}

/* push-to-talk button */
.ptt-wrap{position:relative;width:15rem;height:15rem;margin:2rem auto 0;display:grid;place-items:center}
.ptt-wrap::before,.ptt-wrap::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid rgba(220,38,38,.25)}
.ptt-wrap::after{inset:1rem;border-color:rgba(220,38,38,.18)}
#redBtn{position:relative;width:12rem;height:12rem;border-radius:50%;color:#fff;line-height:1.25;
  font-size:1.6rem;font-weight:900;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background:radial-gradient(circle at 35% 28%,#f87171,#dc2626 55%,#7f1d1d);
  box-shadow:0 25px 60px -15px rgba(220,38,38,.7),inset 0 -10px 24px rgba(0,0,0,.35),inset 0 8px 16px rgba(255,255,255,.22);
  transition:transform .12s ease,box-shadow .2s ease}
#redBtn:active{transform:scale(.95)}
/* while talking the script sets an inline background -> switch to the green "on air" look */
#redBtn[style*="background"]{background:radial-gradient(circle at 35% 28%,#86efac,#22c55e 55%,#14532d)!important;color:#03140a;
  box-shadow:0 25px 60px -10px rgba(34,197,94,.8),inset 0 -10px 24px rgba(0,0,0,.3),inset 0 8px 16px rgba(255,255,255,.3);
  animation:onAir 1.2s ease-out infinite;transform:scale(.97)}
@keyframes onAir{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55),0 25px 60px -10px rgba(34,197,94,.8)}100%{box-shadow:0 0 0 36px rgba(34,197,94,0),0 25px 60px -10px rgba(34,197,94,.8)}}
</style>
</head>
<body class="text-white">
<div class="wrap max-w-sm mx-auto px-5 pb-8">

<div id="nameScreen" class="screen pt-10 text-center">
<div class="logo">📻</div>
<h1 class="text-4xl font-black mt-6 tracking-tight">ווקי-טוקי</h1>
<p class="opacity-60 mt-2">לוחצים, מדברים, וכולם שומעים</p>
<div class="card p-5 mt-8 text-right">
<label for="myName" class="text-sm opacity-60 font-medium">תכתוב את השם שלך</label>
<input id="myName" placeholder="למשל: סבא" autocomplete="off" class="field w-full mt-2 p-4 rounded-2xl text-center text-xl font-bold text-white">
<button onclick="goWelcome()" class="btn btn-amber w-full mt-4 font-black py-4 rounded-2xl text-xl">המשך ←</button>
</div>
</div>

<div id="welcome" class="screen hidden text-center pt-8">
<p class="text-lg opacity-80">שלום <b id="hello" class="text-yellow-400"></b> 👋</p>
<h2 class="text-3xl font-black mt-2">מה אתה רוצה?</h2>
<div class="space-y-3 mt-8">
<button onclick="goHost()" class="btn btn-amber opt">
<span class="ic">👑</span>
<span><span class="block font-black text-lg">אני מארח</span><span class="block text-sm opacity-70">יוצר חדר ומזמין חברים</span></span>
</button>
<button onclick="goJoin()" class="btn btn-ghost opt">
<span class="ic">🚪</span>
<span><span class="block font-bold text-lg">הצטרפות לקבוצה</span><span class="block text-sm opacity-60">סריקת ברקוד או קוד חדר</span></span>
</button>
</div>
</div>

<div id="hostScreen" class="screen hidden text-center">
<span class="chip">👑 מארח: <b id="hName" class="text-yellow-400"></b></span>
<div class="card p-5 mt-5">
<p class="text-sm opacity-60">קוד החדר שלך</p>
<p id="roomCode" class="text-5xl font-black text-yellow-400 tracking-[.2em] mt-2">------</p>
</div>
<div class="qr-box w-fit mx-auto mt-5"><div id="qrcode"></div></div>
<p class="text-sm opacity-50 mt-3">סרקו את הברקוד כדי להצטרף</p>
<p id="status" class="text-xs opacity-70 mt-3"></p>
<button onclick="goTalk()" class="btn btn-green w-full mt-6 font-black py-4 rounded-2xl text-lg">✅ כנס לדבר</button>
</div>

<div id="joinScreen" class="screen hidden text-center">
<span class="chip">🚪 מצטרף: <b id="jName" class="text-yellow-400"></b></span>
<div class="card p-5 mt-5">
<button onclick="doScan()" class="btn btn-amber w-full font-black py-4 rounded-2xl text-lg">📷 סרוק ברקוד</button>
<div id="reader" class="hidden mt-4"></div>
<div class="divider my-5">או הקלד קוד</div>
<input id="codeInput" placeholder="קוד חדר" autocomplete="off" autocapitalize="characters" class="field w-full p-4 rounded-2xl text-center text-2xl font-black tracking-[.2em] uppercase text-white">
<button onclick="doJoin()" class="btn w-full mt-3 bg-white text-black font-black py-4 rounded-2xl text-lg">הצטרף</button>
</div>
</div>

<div id="talkScreen" class="screen hidden text-center">
<div class="card px-4 py-3 flex items-center justify-between text-sm">
<span>חדר <b id="cMini" class="text-yellow-400 font-black tracking-wider" dir="ltr"></b></span>
<span class="opacity-70">אתה: <b id="myShow" class="opacity-100"></b></span>
<span class="chip !py-1 !px-3 !text-xs">👥 <span dir="ltr"><span id="cnt">1</span>/10</span></span>
</div>
<div id="peers" class="mt-3 text-right space-y-2"></div>

<div id="nowTalk" class="hidden mt-4 p-3 rounded-2xl">
<div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
<p class="text-xs opacity-70 mt-2">מדבר עכשיו</p>
<p id="whoTalk" class="text-xl font-black text-green-400"></p>
</div>

<div class="ptt-wrap">
<button id="redBtn"
onmousedown="startTalk()" onmouseup="stopTalk()"
ontouchstart="startTalk()" ontouchend="stopTalk()"
class="select-none">🔴<br>לחץ<br>ודבר</button>
</div>

<p class="mt-2 opacity-50 text-sm">החזק את הכפתור ודבר · שחרר כדי להקשיב</p>
<button onclick="location.reload()" class="btn btn-ghost mt-8 w-full py-3 rounded-2xl">⚫ נתק וחזור</button>
</div>

<div id="audios"></div>
</div>

<script>
let myName='', peer, myStream, conns={}, names={}, roomCode='', roomId='', talking=false;

function goWelcome(){
myName=document.getElementById('myName').value.trim();
if(!myName){alert('תכתוב שם!');return;}
document.getElementById('nameScreen').classList.add('hidden');
document.getElementById('welcome').classList.remove('hidden');
document.getElementById('hello').textContent=myName;
document.getElementById('hName').textContent=myName;
document.getElementById('jName').textContent=myName;
document.getElementById('myShow').textContent=myName;
}

function genCode(){const l='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=l[Math.floor(Math.random()*l.length)];return s;}

function goHost(){
document.getElementById('welcome').classList.add('hidden');
document.getElementById('hostScreen').classList.remove('hidden');
roomCode=genCode();
document.getElementById('roomCode').textContent=roomCode;
document.getElementById('cMini').textContent=roomCode;
document.getElementById('status').textContent='יוצר חדר...';
try{
peer=new Peer('walkie-'+roomCode);
peer.on('open',id=>{roomId=id; document.getElementById('status').textContent='מוכן!'; let link=location.origin+location.pathname+'?join='+id+'&code='+roomCode; document.getElementById('qrcode').innerHTML=''; new QRCode(document.getElementById('qrcode'),{text:link,width:170,height:170}); setupPeer();});
peer.on('error',()=>{document.getElementById('status').textContent='מוכן (מצב לא מקוון)';});
}catch(e){document.getElementById('status').textContent='מוכן';}
}

function goJoin(){
document.getElementById('welcome').classList.add('hidden');
document.getElementById('joinScreen').classList.remove('hidden');
if(!peer){try{peer=new Peer(); peer.on('open',()=>setupPeer());}catch(e){}}
}

function setupPeer(){
if(!peer) return;
peer.on('connection',c=>{
c.on('open',()=>{conns[c.peer]=c; c.on('data',d=>onData(d,c.peer)); c.send({t:'name',name:myName});});
});
peer.on('call',async c=>{
if(!myStream) myStream=await getMic(true);
c.answer(myStream);
c.on('stream',s=>addAudio(s,c.peer));
});
}

async function getMic(m){try{let s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getAudioTracks()[0].enabled=!m; return s;}catch(e){alert('תאשר מיקרופון'); return null;}}
function addAudio(s,pid){if(document.getElementById('a-'+pid))return; let a=document.createElement('audio'); a.id='a-'+pid; a.srcObject=s; a.autoplay=true; document.getElementById('audios').appendChild(a);}

function onData(d,from){
if(d.t=='name'){names[from]=d.name; renderPeers();}
if(d.t=='talk-s'){document.getElementById('nowTalk').classList.remove('hidden'); document.getElementById('whoTalk').textContent=d.name;}
if(d.t=='talk-e'){document.getElementById('nowTalk').classList.add('hidden');}
if(d.t=='peers'){d.peers.forEach(p=>{if(p!=peer.id) connectTo(p)});}
}

async function connectTo(id){
if(!id||id==peer.id||conns[id]) return;
if(!myStream) myStream=await getMic(true);
if(!myStream) return;
let c=peer.connect(id); c.on('open',()=>{conns[id]=c; c.send({t:'name',name:myName}); c.on('data',d=>onData(d,id)); broadcast();});
let call=peer.call(id,myStream); call.on('stream',s=>addAudio(s,id));
}

function broadcast(){let all=[peer.id,...Object.keys(conns)]; Object.values(conns).forEach(c=>{try{c.send({t:'peers',peers:all})}catch{}}); renderPeers();}
function renderPeers(){
let cnt=Object.keys(conns).length+1;
document.getElementById('cnt').textContent=cnt;
let div=document.getElementById('peers'); div.innerHTML='';
Object.keys(conns).forEach(id=>{
let n=names[id]||id.slice(-4);
div.innerHTML+=`<div class="bg-zinc-900 p-2 rounded flex justify-between"><span>${n}</span><span class="text-xs opacity-50">${id.slice(-4)}</span></div>`;
});
}

function goTalk(){
document.getElementById('hostScreen').classList.add('hidden');
document.getElementById('talkScreen').classList.remove('hidden');
renderPeers();
}

function doJoin(){
let code=document.getElementById('codeInput').value.trim().toUpperCase();
if(!code){alert('תכתוב קוד');return;}
let urlId=new URLSearchParams(location.search).get('join');
let target=urlId||'walkie-'+code;
document.getElementById('cMini').textContent=code;
connectTo(target);
setTimeout(()=>{document.getElementById('joinScreen').classList.add('hidden');document.getElementById('talkScreen').classList.remove('hidden');renderPeers();},1200);
}

let scanner=null;
function doScan(){
let r=document.getElementById('reader'); r.classList.remove('hidden');
scanner=new Html5Qrcode('reader');
scanner.start({facingMode:'environment'},{fps:10,qrbox:200},d=>{
scanner.stop(); r.classList.add('hidden');
try{
let u=new URL(d);
let id=u.searchParams.get('join');
let code=u.searchParams.get('code')||'';
if(id){document.getElementById('codeInput').value=code; document.getElementById('cMini').textContent=code; connectTo(id); setTimeout(()=>{document.getElementById('joinScreen').classList.add('hidden');document.getElementById('talkScreen').classList.remove('hidden');renderPeers();},1000);}
}catch(e){connectTo(d);}
},()=>{});
}

function startTalk(){
if(talking) return;
talking=true;
if(myStream) myStream.getAudioTracks()[0].enabled=true;
let b=document.getElementById('redBtn'); b.textContent='מדבר...'; b.style.background='#22c55e';
document.getElementById('nowTalk').classList.remove('hidden');
document.getElementById('whoTalk').textContent=myName+' (אתה)';
Object.values(conns).forEach(c=>{try{c.send({t:'talk-s',name:myName})}catch{}});
}
function stopTalk(){
talking=false;
if(myStream) myStream.getAudioTracks()[0].enabled=false;
let b=document.getElementById('redBtn'); b.innerHTML='🔴<br>לחץ<br>ודבר'; b.style.background='';
document.getElementById('nowTalk').classList.add('hidden');
Object.values(conns).forEach(c=>{try{c.send({t:'talk-e'})}catch{}});
}
</script>
</body>
</html>
